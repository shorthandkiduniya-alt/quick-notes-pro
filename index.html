<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuickNotes Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #fafafa; color: #2c3e50; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Layout Header */
        .app-main-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 10px 20px; }
        .app-title { font-size: 24px; font-weight: 700; color: #1a252f; }
        .header-action-icons { display: flex; gap: 20px; font-size: 20px; color: #7f8c8d; }

        .folder-bar { display: flex; gap: 20px; padding: 10px 20px; background: #fafafa; margin-bottom: 10px; }
        .folder-tab { font-size: 14px; color: #95a5a6; font-weight: 600; padding: 4px 0; }
        .folder-tab.active { color: #1a252f; border-bottom: 2px solid #2c3e50; }

        /* Smooth Screen Toggling */
        .view { display: none; flex-direction: column; flex: 1; padding: 20px; overflow-y: auto; }
        .active-view { display: flex !important; }

        /* Multiple Notes List Container */
        .notes-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 100px; }
        .note-card { background: #ffffff; padding: 16px; border-radius: 12px; border: 1px solid #eaeaea; position: relative; cursor: pointer; }
        .note-card b { font-size: 16px; color: #1a252f; display: block; margin-bottom: 4px; }
        .note-card p { font-size: 13px; color: #7f8c8d; }
        .card-date { font-size: 11px; color: #bdc3c7; margin-top: 6px; }
        .delete-btn { position: absolute; bottom: 14px; right: 16px; background: none; border: none; color: #e74c3c; font-size: 13px; font-weight: bold; cursor: pointer; padding: 5px; }

        /* Fixed Touch Button at Bottom */
        .bottom-create-trigger { position: fixed; bottom: 25px; left: 5%; width: 90%; background: #2c3e50; border: none; border-radius: 30px; padding: 16px 24px; font-size: 16px; color: #ffffff; text-align: center; font-weight: 600; z-index: 9999; cursor: pointer; display: block; }

        /* Premium Professional Editor Layout */
        .editor-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #eaeaea; margin-bottom: 15px; }
        .back-btn { background: #cbd5e1; border: none; color: #2c3e50; font-size: 14px; font-weight: 600; cursor: pointer; padding: 8px 16px; border-radius: 20px; }
        .note-title-input { width: 100%; border: none; background: transparent; font-size: 26px; font-weight: 700; outline: none; margin-bottom: 8px; color: #1a252f; }
        .meta-info { font-size: 12px; color: #95a5a6; margin-bottom: 15px; }
        .mind-map-badge { display: inline-block; background: #e8f4fd; color: #2980b9; border: 1px dashed #3498db; padding: 6px 14px; font-size: 12px; border-radius: 20px; font-weight: 600; margin-bottom: 15px; cursor: pointer; }
        
        /* Advanced Editable Area */
        .editor-container { flex: 1; display: flex; flex-direction: column; padding-bottom: 60px; }
        .rich-editor { width: 100%; flex: 1; border: none; background: transparent; font-size: 17px; line-height: 1.6; outline: none; color: #2c3e50; overflow-y: auto; min-height: 200px; }
        .rich-editor[placeholder]:empty:before { content: attr(placeholder); color: #bdc3c7; }
        
        /* Attachments inside Note Workspace */
        .embedded-media { max-width: 100%; border-radius: 8px; margin: 10px 0; display: block; }
        .audio-item { display: flex; align-items: center; background: #f1f2f6; padding: 10px; border-radius: 8px; margin: 8px 0; border: 1px solid #e4e7ed; }

        /* Interactive Action Toolbars */
        .toolbar { background: #ffffff; border-top: 1px solid #eaeaea; display: flex; justify-content: space-around; align-items: center; padding: 14px 5px; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100; }
        .toolbar button { background: none; border: none; font-size: 14px; font-weight: 600; color: #7f8c8d; cursor: pointer; padding: 10px; }
        .tools-popup { display: none; background: #ffffff; border-top: 1px solid #eaeaea; position: fixed; bottom: 48px; left: 0; width: 100%; padding: 12px; gap: 10px; justify-content: center; z-index: 99; flex-wrap: wrap; box-shadow: 0 -4px 15px rgba(0,0,0,0.04); }
        .tool-btn { background: #f8f9fa; border: 1px solid #e2e8f0; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600; color: #4a5568; }

        /* Fullscreen Painting View */
        .canvas-view-style { display: none; flex-direction: column; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #ffffff; z-index: 20000; padding: 20px; }
        .canvas-container { flex: 1; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; margin: 15px 0; position: relative; }
        #paintCanvas { width: 100%; height: 100%; background: #ffffff; touch-action: none; border-radius: 12px; }
        .color-palette { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
        .color-dot { width: 25px; height: 25px; border-radius: 50%; border: 1px solid #ddd; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. DASHBOARD VIEW -->
    <div id="listView" class="view active-view">
        <div class="app-main-header">
            <div class="app-title">QuickNotes</div>
            <div class="header-action-icons"><div>🔍</div><div>⚙️</div></div>
        </div>
        <div class="folder-bar">
            <div class="folder-tab active">All Notes</div>
            <div class="folder-tab">Personal</div>
            <div class="folder-tab">Work</div>
        </div>
        <div id="notesContainer" class="notes-list"></div>
        <!-- Perfect Touch Unified Trigger Button -->
        <button class="bottom-create-trigger" id="createNoteTrigger" onclick="openNewBlankNote()">+ Create a note</button>
    </div>

    <!-- 2. PROFESSIONAL EDITOR VIEW -->
    <div id="editorView" class="view">
        <div class="editor-header">
            <button class="back-btn" onclick="saveAndGoBack()">✕ Close & Save</button>
            <div id="recordingStatus" style="font-size:12px; color:#e74c3c; font-weight:600; display:none;">🎙 Recording...</div>
            <div style="font-size: 13px; font-weight: 600; color: #2ecc71;">Auto Saving</div>
        </div>
        
        <input type="text" id="noteTitle" class="note-title-input" placeholder="Title">
        <div class="meta-info" id="metaInfoText">8 June | 0 characters</div>
        
        <div onclick="addMindMap()" class="mind-map-badge">💡 Insert Mind Map Template</div>

        <div class="editor-container">
            <div id="richEditor" class="rich-editor" contenteditable="true" placeholder="Start writing here..."></div>
        </div>

        <!-- FORMATTING UTILITY -->
        <div id="formattingPopup" class="tools-popup">
            <button class="tool-btn" onclick="applyFormat('bold')"><b>B</b></button>
            <button class="tool-btn" onclick="applyFormat('italic')"><i>I</i></button>
            <button class="tool-btn" onclick="applyFormat('underline')"><u>U</u></button>
            <button class="tool-btn" onclick="applyFormat('foreColor', '#e74c3c')"><span style="color:red">Red</span></button>
            <button class="tool-btn" onclick="applyFormat('foreColor', '#2c3e50')">Normal</button>
            <button class="tool-btn" onclick="applyFormat('hiliteColor', '#fff3cd')"><mark>Highlight</mark></button>
            <button class="tool-btn" onclick="applyFormat('hiliteColor', '#ffffff')">Clean</button>
            <button class="tool-btn" onclick="applyFormat('justifyLeft')">Left</button>
            <button class="tool-btn" onclick="applyFormat('justifyCenter')">Center</button>
            <button class="tool-btn" onclick="applyFormat('justifyRight')">Right</button>
        </div>

        <!-- BOTTOM TOOLBAR -->
        <div class="toolbar">
            <button onclick="toggleToolbarPopup('formattingPopup')">Format</button>
            <button onclick="triggerFileSelect()">Gallery</button>
            <button onclick="openSketchPad()">Sketch</button>
            <button id="recordBtn" onclick="handleVoiceRecord()">Record</button>
            <button onclick="applyFormat('insertUnorderedList')">Points</button>
        </div>
        <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="insertGalleryPhoto(event)">
    </div>

    <!-- 3. DRAWING CANVAS WORKSPACE -->
    <div id="canvasView" class="canvas-view-style">
        <div class="editor-header">
            <button class="back-btn" onclick="closeSketchPad(false)">Cancel</button>
            <h3 style="font-size:16px; font-weight:600;">Canvas Drawing</h3>
            <button class="back-btn" style="background:#2ecc71; color:white; padding:6px 14px; border-radius:20px;" onclick="closeSketchPad(true)">Insert Sketch</button>
        </div>
        <div class="color-palette">
            <div class="color-dot" style="background:#2c3e50" onclick="setInkColor('#2c3e50')"></div>
            <div class="color-dot" style="background:#e74c3c" onclick="setInkColor('#e74c3c')"></div>
            <div class="color-dot" style="background:#2ecc71" onclick="setInkColor('#2ecc71')"></div>
            <div class="color-dot" style="background:#f1c40f" onclick="setInkColor('#f1c40f')"></div>
        </div>
        <div class="canvas-container"><canvas id="paintCanvas"></canvas></div>
    </div>

<script>
    let savedNotesList = JSON.parse(localStorage.getItem('final_secure_notes')) || [];
    let activeNoteId = null;
    let voiceRecorderObj = null;
    let voiceChunks = [];
