<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuickNotes Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #fafafa; color: #2c3e50; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .app-main-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 10px 20px; }
        .app-title { font-size: 24px; font-weight: 700; color: #1a252f; }
        .header-action-icons { display: flex; gap: 20px; font-size: 20px; color: #7f8c8d; }

        .folder-bar { display: flex; gap: 20px; padding: 10px 20px; background: #fafafa; }
        .folder-tab { font-size: 14px; color: #95a5a6; font-weight: 600; padding: 4px 0; }
        .folder-tab.active { color: #1a252f; border-bottom: 2px solid #2c3e50; }

        /* Simple Hidden/Show Logic */
        .view { display: none; flex-direction: column; flex: 1; padding: 20px; }
        .active-view { display: flex !important; }

        .notes-list { display: flex; flex-direction: column; gap: 12px; }
        .note-card { background: #ffffff; padding: 16px; border-radius: 12px; border: 1px solid #eaeaea; font-size: 14px; color: #7f8c8d; }

        /* Big Clickable Fixed Button at Bottom */
        .bottom-create-trigger { position: fixed; bottom: 25px; left: 5%; width: 90%; background: #2c3e50; border: none; border-radius: 30px; padding: 16px 24px; font-size: 16px; color: #ffffff; text-align: center; font-weight: 600; z-index: 9999; cursor: pointer; display: block; }

        /* Editor Styles */
        .editor-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #eaeaea; margin-bottom: 20px; }
        .back-btn { background: #cbd5e1; border: none; color: #2c3e50; font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px 16px; border-radius: 20px; }
        .note-title-input { width: 100%; border: none; background: transparent; font-size: 26px; font-weight: 700; outline: none; margin-bottom: 8px; color: #1a252f; }
        .meta-info { font-size: 12px; color: #95a5a6; margin-bottom: 15px; }
        
        textarea { width: 100%; flex: 1; border: none; background: transparent; font-size: 17px; line-height: 1.6; outline: none; color: #2c3e50; resize: none; min-height: 200px; }
    </style>
</head>
<body>

    <!-- 1. DASHBOARD VIEW (MAIN CONTAINER) -->
    <div id="listView" class="view active-view">
        <div class="app-main-header">
            <div class="app-title">QuickNotes</div>
            <div class="header-action-icons"><div>🔍</div><div>⚙️</div></div>
        </div>
        <div class="folder-bar">
            <div class="folder-tab active">All Notes</div>
            <div class="folder-tab">Personal</div>
            <div class="folder-tab">Work</div>
        </div>
        <div id="notesContainer" class="notes-list">
            <div class="note-card" id="dummyCard">No notes found. Tap below to start writing.</div>
        </div>
        <!-- Single Big Trigger Button -->
        <button class="bottom-create-trigger" id="createNoteTrigger" onclick="openTheEditor()">+ Create a note</button>
    </div>

    <!-- 2. BASIC SECURE EDITOR VIEW -->
    <div id="editorView" class="view">
        <div class="editor-header">
            <button class="back-btn" onclick="closeTheEditor()">✕ Close & Save</button>
            <div style="font-size: 14px; font-weight: bold; color: #2ecc71;">Auto Saving</div>
        </div>
        <input type="text" id="noteTitle" class="note-title-input" placeholder="Title">
        <div class="meta-info">8 June | Offline AutoSave</div>
        <textarea id="noteArea" placeholder="Start writing here (Automatic save hota rahega)..."></textarea>
    </div>

<script>
    const listView = document.getElementById('listView');
    const editorView = document.getElementById('editorView');
    const noteTitle = document.getElementById('noteTitle');
    const noteArea = document.getElementById('noteArea');
    const dummyCard = document.getElementById('dummyCard');

    // Load saved text instantly on app startup
    window.onload = function() {
        const savedTitle = localStorage.getItem('quick_title_fix');
        const savedText = localStorage.getItem('quick_text_fix');
        if (savedTitle || savedText) {
            dummyCard.innerHTML = `<b>${savedTitle || 'Untitled'}</b><br>${savedText || 'No text'}`;
        }
    }

    // Direct Screen Toggle Functions (No delays, no freezing)
    function openTheEditor() {
        noteTitle.value = localStorage.getItem('quick_title_fix') || '';
        noteArea.value = localStorage.getItem('quick_text_fix') || '';
        listView.classList.remove('active-view');
        editorView.classList.add('active-view');
    }

    function closeTheEditor() {
        const titleVal = noteTitle.value.trim();
        const textVal = noteArea.value.trim();
        
        if(titleVal || textVal) {
            dummyCard.innerHTML = `<b>${titleVal || 'Untitled'}</b><br>${textVal || 'No text'}`;
        } else {
            dummyCard.innerHTML = "No notes found. Tap below to start writing.";
        }
        
        editorView.classList.remove('active-view');
        listView.classList.add('active-view');
    }

    // Pure Auto-Save Logic (Save code directly into local memory on every single keystroke)
    noteTitle.oninput = function() { localStorage.setItem('quick_title_fix', noteTitle.value); }
    noteArea.oninput = function() { localStorage.setItem('quick_text_fix', noteArea.value); }
</script>
</body>
</html>
